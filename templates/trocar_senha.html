<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar Senha | SIAP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 font-sans min-h-screen flex items-center justify-center p-4 text-slate-800 antialiased">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-200 animate-in fade-in zoom-in duration-200">
        <!-- Topo Decorativo -->
        <div class="bg-gradient-to-r from-slate-900 to-[#070e20] p-6 text-white text-center relative">
            <div class="w-14 h-14 bg-amber-500 text-slate-950 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg shadow-amber-500/30 text-2xl">
                <i class="fa-solid fa-key"></i>
            </div>
            <h1 class="text-xl font-black tracking-tight">Alteração de Senha</h1>
            <p class="text-xs text-slate-300 mt-1">Atualize sua credencial de acesso ao SIAP</p>
            <p class="text-[11px] font-mono text-emerald-400 mt-0.5">{{ usuario.email if usuario else '' }}</p>
        </div>

        <!-- Formulário -->
        <form method="POST" action="/perfil/trocar-senha" class="p-8 space-y-5">
            {% if erro %}
            <div class="bg-rose-50 border border-rose-200 text-rose-800 text-xs font-bold p-3.5 rounded-xl flex items-center space-x-2.5">
                <i class="fa-solid fa-triangle-exclamation text-rose-600 text-base"></i>
                <span>{{ erro }}</span>
            </div>
            {% endif %}

            {% if msg %}
            <div class="bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs font-bold p-3.5 rounded-xl flex items-center space-x-2.5">
                <i class="fa-solid fa-circle-check text-emerald-600 text-base"></i>
                <span>{{ msg }}</span>
            </div>
            {% endif %}

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">Senha Atual *</label>
                <div class="relative">
                    <input type="password" name="senha_atual" required placeholder="Digite sua senha atual" class="w-full text-xs px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none pr-10">
                    <i class="fa-solid fa-lock absolute right-3.5 top-3.5 text-slate-400 text-xs"></i>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">Nova Senha * (Mínimo 6 dígitos)</label>
                <div class="relative">
                    <input type="password" name="nova_senha" required minlength="6" placeholder="Nova senha segura" class="w-full text-xs px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none pr-10">
                    <i class="fa-solid fa-key absolute right-3.5 top-3.5 text-slate-400 text-xs"></i>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">Confirme a Nova Senha *</label>
                <div class="relative">
                    <input type="password" name="confirmar_nova_senha" required minlength="6" placeholder="Repita a nova senha" class="w-full text-xs px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none pr-10">
                    <i class="fa-solid fa-shield-check absolute right-3.5 top-3.5 text-slate-400 text-xs"></i>
                </div>
            </div>

            <div class="pt-3 space-y-2.5">
                <button type="submit" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black text-xs uppercase tracking-wider rounded-xl shadow-md transition">
                    Salvar Nova Senha
                </button>
                <a href="/usuarios" class="block text-center py-2.5 text-xs font-bold text-slate-500 hover:text-slate-800 transition">
                    <i class="fa-solid fa-arrow-left mr-1"></i> Voltar para Gestão de Acesso
                </a>
            </div>
        </form>
    </div>
</body>
</html>
